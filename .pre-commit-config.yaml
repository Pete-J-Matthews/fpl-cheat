# Install with: uv run --extra dev pre-commit install
# Run over everything: uv run --extra dev pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff pin in pyproject.toml's dev extra.
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # Catches PEM/SSH keys only, not .env values -- those rely on .gitignore.
      - id: detect-private-key
