[project]
name = "fpl-cheat"
version = "0.1.0"
description = "Fantasy Premier League team comparison app"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "streamlit-searchbox>=0.1.20",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.0",
    "apscheduler>=3.10.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]


[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ['py39']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
